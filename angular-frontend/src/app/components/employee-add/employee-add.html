<!-- src/app/components/employee-form/employee-form.component.html -->
<div class="form-container">
  <h2>Employee Registration</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="employee.employeeName" name="name" required>
    </div>
    
    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" [(ngModel)]="employee.dob" name="dob" required>
    </div>
    
    <div class="form-group">
      <label>Marital Status</label>
      <select [(ngModel)]="employee.maritalStatus" name="maritalStatus">
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Divorced">Divorced</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Contact Number</label>
      <input type="tel" [(ngModel)]="employee.contactNo" name="contact">
    </div>
    
    <div class="form-group">
      <label>Address</label>
      <textarea [(ngModel)]="employee.address" name="address"></textarea>
    </div>
    
    <div class="form-group">
      <label>Personal Email</label>
      <input type="email" [(ngModel)]="employee.personalEmail" name="email">
    </div>
    
    <div class="form-group">
      <label>Department</label>
      <input type="text" [(ngModel)]="employee.department" name="department">
    </div>
    
    <div class="form-group">
      <label>Branch</label>
      <input type="text" [(ngModel)]="employee.branch" name="branch">
    </div>
    
    <button type="submit">Add Employee</button>
  </form>
</div>
